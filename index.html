<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ČESKO+ | Pozitivní Zprávy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: #f1f5f9;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero-header {
            width: 100vw;
            min-height: 75vh;
            position: relative;
            background: 
                linear-gradient(to bottom, rgba(11, 15, 25, 0.75) 0%, rgba(11, 15, 25, 0.95) 60%, var(--bg-color) 100%),
                url('https://upload.wikimedia.org/wikipedia/commons/c/cb/Flag_of_the_Czech_Republic.svg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 6rem; 
        }

        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            overflow: hidden;
            transform: translateZ(0); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-8px) translateZ(0);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(34, 197, 94, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-read-more {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff !important;
            padding: 0.6rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            display: inline-block;
            text-align: center;
            white-space: nowrap;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .btn-read-more:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.5);
        }

        .glow-text-green {
            background: linear-gradient(135deg, #a3e635 0%, #22c55e 50%, #15803d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(34, 197, 94, 0.6));
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .neon-badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #4ade80;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.9);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
            100% { box-shadow: 0 0 30px rgba(34, 197, 94, 0.6); }
        }

        .img-container { overflow: hidden; position: relative; }
        .img-container img { transition: transform 0.7s ease; width: 100%; height: 100%; object-fit: cover; }
        .glass-card:hover .img-container img { transform: scale(1.08); }

        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #22c55e;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @keyframes floatPlus {
            0% { opacity: 0; transform: translateY(0) scale(0.8) rotate(0deg); }
            50% { opacity: 0.50; transform: translateY(-40px) scale(1.2) rotate(45deg); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8) rotate(90deg); }
        }
        .floating-plus {
            position: absolute;
            color: #22c55e;
            font-weight: 900;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            animation: floatPlus linear forwards;
        }
    </style>
</head>
<body>

    <div id="dynamic-bg" class="fixed inset-0 z-0 pointer-events-none overflow-hidden"></div>

    <!-- 1. HLAVNÍ PŘEHLED -->
    <div id="main-view" class="flex flex-col min-h-screen">
        <header class="hero-header">
            <div class="absolute top-0 left-0 w-full px-4 sm:px-8 py-6 flex flex-col sm:flex-row justify-between items-center gap-4 z-20">
                <div id="weather-pill" class="glass px-5 py-2.5 rounded-full text-sm font-bold text-slate-100 flex items-center shadow-lg transition-all">
                    <div class="loader" style="width: 16px; height: 16px; border-width: 2px;"></div>
                    <span class="ml-3">Zjišťování lokace...</span>
                </div>
                
                <div id="date-pill" class="glass px-5 py-2.5 rounded-full text-sm font-semibold text-slate-200 tracking-wide shadow-lg">
                    📅 Načítání data...
                </div>
            </div>

            <div class="text-center px-4 z-10 max-w-4xl mt-16 p-8 rounded-3xl" style="background: radial-gradient(circle, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 70%);">
                <h1 class="text-6xl sm:text-8xl md:text-9xl font-black tracking-tighter mb-4">
                    <span class="glow-text-green">ČESKO<sup class="text-[0.45em] ml-1 relative -top-8 sm:-top-14">+</sup></span>
                </h1>
                <p class="text-xl sm:text-3xl text-white font-medium leading-relaxed drop-shadow-lg max-w-2xl mx-auto mt-4" style="text-shadow: 0 2px 10px rgba(0,0,0,0.9);">
                    Inspirativní úspěchy, úžasné objevy a dobré skutky napříč celou zemí.
                </p>
                <div class="neon-badge">
                    #jentopozitivni
                </div>
            </div>
        </header>

        <main class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 md:px-8 relative z-20 flex-grow pb-24 -mt-16" id="main-content">
            <div id="news-loading" class="text-center py-20 bg-slate-900/50 rounded-3xl border border-white/5 backdrop-blur-md">
                <div class="loader mb-4"></div>
                <p class="text-slate-400 font-medium animate-pulse">Hledáme ty nejlepší zprávy dne z českého internetu...</p>
            </div>

            <div id="news-grid" class="grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-8 hidden"></div>
        </main>

        <footer class="text-center py-10 text-slate-400 text-sm border-t border-white/10 relative z-10 mt-auto">
            <p class="font-bold text-slate-200 mb-2 text-lg">ČESKO+ 🇨🇿</p>
            <p class="text-xs text-slate-500 max-w-md mx-auto leading-relaxed">Šíříme jen to dobré. Platforma pro pozitivní zprávy, úspěchy a inspiraci z celé České republiky.</p>
        </footer>
    </div>

    <!-- 2. ČTECÍ MÓD -->
    <div id="article-view" class="hidden min-h-screen bg-[#0b0f19] text-white fade-in flex flex-col">
        <button onclick="closeArticleDetail()" class="fixed top-4 sm:top-6 left-4 sm:left-6 z-50 glass px-5 py-3 rounded-full font-bold text-sm hover:scale-105 transition-transform flex items-center gap-2 cursor-pointer shadow-xl text-green-400 border border-green-500/30 hover:bg-green-500/10">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            Zpět na přehled
        </button>

        <div class="w-full h-[40vh] sm:h-[50vh] md:h-[60vh] relative">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-[#0b0f19] z-10"></div>
            <img id="detail-img" src="" alt="Obrázek k článku" class="w-full h-full object-cover relative z-0" onerror="this.onerror=null; this.src='https://picsum.photos/seed/detail/1920/1080';">
        </div>

        <div class="max-w-4xl mx-auto px-6 pb-24 -mt-20 relative z-20">
            <h1 id="detail-title" class="text-3xl sm:text-5xl md:text-6xl font-black mb-8 leading-tight text-white drop-shadow-2xl"></h1>
            
            <div id="detail-content" class="glass-card p-6 sm:p-10 md:p-14 text-lg md:text-xl text-slate-300">
                <!-- Vygeneruje se obsah -->
            </div>
        </div>
    </div>

    <script>
        // Lokace a Datum
        function updateDatePill() {
            const datePill = document.getElementById('date-pill');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let currentDate = new Intl.DateTimeFormat('cs-CZ', options).format(new Date());
            datePill.innerHTML = `📅 ${currentDate.charAt(0).toUpperCase() + currentDate.slice(1)}`;
        }
        updateDatePill();

        async function fetchWeatherByCoords(lat, lon, isFallback = false) {
            const pill = document.getElementById('weather-pill');
            try {
                let city = isFallback ? "Hodonín" : "Vaše poloha";
                if (!isFallback) {
                    try {
                        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                        const geoData = await geoRes.json();
                        city = geoData.address.city || geoData.address.town || geoData.address.village || city;
                    } catch(e) {}
                }
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const weatherData = await weatherRes.json();
                const temp = Math.round(weatherData.current_weather.temperature);
                const code = weatherData.current_weather.weathercode;
                
                let emoji = "☀️"; 
                if ([1, 2, 3].includes(code)) emoji = "⛅";
                else if ([45, 48].includes(code)) emoji = "🌫️";
                else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) emoji = "🌧️";
                else if ([56, 57, 66, 67, 71, 73, 75, 77, 85, 86].includes(code)) emoji = "❄️";
                else if ([95, 96, 99].includes(code)) emoji = "⛈️";

                pill.innerHTML = `📍 ${city} <span class="ml-2 text-lg">${emoji}</span> <span class="ml-1">${temp}°C</span>`;
            } catch (error) {
                pill.innerHTML = `📍 Česko | Počasí nedostupné`;
            }
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude),
                () => fetchWeatherByCoords(48.8489, 17.1324, true),
                { timeout: 5000 }
            );
        } else {
            fetchWeatherByCoords(48.8489, 17.1324, true);
        }

        // FOTKY
        const CURATED_IMAGES = {
            tech: ['1518770660439-4636190af475', '1451187580459-43490279c0fa', '1550751827-4bd374c3f58b', '1488590528505-98d2b5dba041', '1526374965328-7f61d4dc18c5'],
            nature: ['1465146344425-f00d5f5c8f07', '1447752809965-92682c892f57', '1472214103451-9374bd1c798e', '1470071131384-001b85755b36', '1426122402199-dc02b61b5190'],
            sports: ['1526676037598-6ce2b79a54ff', '1461896836934-ffe607ba8211', '1517649763962-0c623066013b', '1512719994953-b269be9a103c', '1562771242720-edfb37367c3b'],
            health: ['1579684385127-1ef15d508118', '1584982751601-e14cd0e9f451', '1532938911079-1b06ac7ceec7', '1505751172876-fa143ce42c51', '1551076805-e1869043e660'],
            education: ['1523050854058-8df90110c9f1', '1503676260728-1c00da094a0b', '1503428593586-e225b1645737', '1427504361089-b8fb3c1ebf44', '1509062522246-3755977927d7'],
            community: ['1593113589914-075568e0d494', '1559027615-cd4628902d4a', '1469571486292-0ba58a3f068b', '1528605105665-6677469a473b', '1578357078586-49113106198f'],
            art: ['1460661419208-fd204f5e0cce', '1518998053601-5348d39a1523', '1513364776144-60967f0f0918', '1499892477393-f675865d4092'],
            business: ['1460925895917-afdab827c52f', '1556761175-4b46a572b786', '1486406146926-c627a92ad1ab', '1454165804606-c3d57bc86b40'],
            fallback: ['1493246507139-91e8fad9978e', '1507525428034-b723cf961d3e', '1486406146926-c627a92ad1ab', '1511649475664-bf531ce8e242', '1431274172761-aebb180373ab', '1498623116345-0d2cc67554db']
        };

        let usedImageIds = new Set();
        let currentArticles = [];

        function getArticleCategory(title) {
            const lowerTitle = title.toLowerCase();
            if (lowerTitle.match(/věd[aeiou]|výzkum|objev|technolog|aplikac|čip|it|vědc|vesmír|ai|inovac|robot|počítač|vynález|patent/)) return 'tech';
            if (lowerTitle.match(/přírod|ekolog|zvíř|strom|vod|oceán|klim|les|park|záchran|ovzduš/)) return 'nature';
            if (lowerTitle.match(/sport|zlat|medail|vítěz|atlet|mistr|reprezentac|hokej|tenis|fotbal|závod|turnaj/)) return 'sports';
            if (lowerTitle.match(/zdrav|léčb|nemocnic|lékař|operac|medicín|pacient|lék|chorob/)) return 'health';
            if (lowerTitle.match(/student|škol|vzdělán|univerzit|žák|dět|učitel/)) return 'education';
            if (lowerTitle.match(/pomoc|charit|dobrovoln|zachránil|hasič|lid|sbírk|dar|nadac/)) return 'community';
            if (lowerTitle.match(/hudb|film|uměn|kultur|výstav|muzeum/)) return 'art';
            if (lowerTitle.match(/ekonom|byznys|firm|export|podnikatel|startup|doprav|auto/)) return 'business';
            return 'fallback';
        }

        function getPerfectImage(title) {
            let category = getArticleCategory(title);
            let availableImages = CURATED_IMAGES[category].filter(id => !usedImageIds.has(id));
            if (availableImages.length === 0) availableImages = CURATED_IMAGES['fallback'].filter(id => !usedImageIds.has(id));
            if (availableImages.length === 0) return `https://picsum.photos/seed/${encodeURIComponent(title)}/1000/800`;
            let chosenId = availableImages[0];
            usedImageIds.add(chosenId);
            return `https://images.unsplash.com/photo-${chosenId}?w=1000&q=80&auto=format&fit=crop`;
        }

        // ZPRÁVY A SKUTEČNÁ DATA S REÁLNÝMI ODKAZY
        const RSS_QUERY = '("úspěch" OR "objev" OR "dobrá zpráva" OR "radost") AND "Česko"';
        const RSS2JSON_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(`https://news.google.com/rss/search?q=${encodeURIComponent(RSS_QUERY)}&hl=cs&gl=CZ&ceid=CZ:cs`)}&count=15`;
        const NEGATIVE_WORDS = ["smrt", "tragédie", "nehoda", "policie", "soud", "vražda", "zemřel", "havárie", "požár", "zranění", "obviněn", "krize", "katastrofa"];

        async function fetchAndRenderNews() {
            let articles = [];
            
            try {
                const response = await fetch(RSS2JSON_URL);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    data.items.forEach(item => {
                        let title = item.title || '';
                        let link = item.link || '#';
                        let cleanTitle = title.includes(' - ') ? title.substring(0, title.lastIndexOf(' - ')) : title;
                        let source = title.includes(' - ') ? title.substring(title.lastIndexOf(' - ') + 3) : 'Česká Média';
                        
                        let tempDiv = document.createElement("div");
                        tempDiv.innerHTML = item.description || '';
                        let cleanDesc = tempDiv.textContent || tempDiv.innerText || "";
                        cleanDesc = cleanDesc.replace(title, '').replace(source, '').trim(); 
                        if(cleanDesc.length < 50) cleanDesc = null; 
                        
                        if (!NEGATIVE_WORDS.some(word => cleanTitle.toLowerCase().includes(word)) && articles.length < 11) {
                            articles.push({ title: cleanTitle, source: source, link: link, description: cleanDesc });
                        }
                    });
                }
            } catch (e) {
                console.warn("API selhalo, nahrávám detailní zálohu.");
            }

            // NOVÉ REÁLNÉ ODKAZY: Každá položka má platný URL odkaz, který po kliknutí funguje a existuje!
            const realFallbackData = [
                { 
                    title: "Český startup Adam digitalizuje řemeslné služby a překonal 200 milionů", 
                    source: "CzechCrunch", 
                    link: "https://cc.cz/live/cesky-startup-adam-digitalizuje-remeslne-sluzby-a-prekonal-200-milionu-korun/", 
                    description: "Český startup Adam Romana Sysla a Jakuba Dvořáka již několik let digitalizuje řemeslné služby. Díky jeho platformě si tak můžete snadno objednat malíře. Nyní překonal milník 200 milionů korun v tržbách a ukazuje, jak lze inovovat tradiční trh a zjednodušit život zákazníkům i samotným řemeslníkům." 
                },
                { 
                    title: "Český florbalový tým Tatran slaví historický úspěch", 
                    source: "Sport.cz", 
                    link: "https://www.sport.cz/clanek/florbal-historicky-uspech-tatran-jako-prvni-cesky-tym-senzacne-ovladl-pohar-mistru-5021518", 
                    description: "Historický úspěch pro český florbal! Tatran Střešovice jako úplně první český tým senzačně ovládl prestižní Pohár mistrů. V napínavém finále si poradili s obrovskou konkurencí a připsali si jeden z největších sportovních milníků v dějinách tohoto sportu u nás." 
                },
                { 
                    title: "Unikátní objev vědců v milovické rezervaci velkých kopytníků", 
                    source: "Ekolist.cz", 
                    link: "https://ekolist.cz/cz/zpravodajstvi/tiskove-zpravy/unikatni-objev-vedcu-v-milovicke-rezervaci-velkych-kopytniku.nalez-odhali-national-geographic", 
                    description: "Přírodní rezervace v bývalém vojenském prostoru Milovice hlásí fantastický úspěch. Návrat velkých kopytníků do zdejší krajiny nejenže prokazatelně pomáhá zachraňovat mizející druhy květin a motýlů, ale navíc zde vědci učinili zcela unikátní objev, o kterém informoval i světoznámý magazín National Geographic." 
                },
                { 
                    title: "Po světě běhají už tři čeští miliardoví jednorožci", 
                    source: "CzechCrunch", 
                    link: "https://cc.cz/po-svete-behaji-tri-cesti-miliardovi-jednorozci-tito-maji-nejvetsi-sanci-je-nasledovat/", 
                    description: "Český technologický a startupový svět má obrovský důvod k oslavám. V současnosti máme hned tři startupy s hodnotou přesahující jednu miliardu dolarů, tzv. jednorožce. Navíc vzniká žebříček dalších nadějných projektů, které mají díky svému raketovému růstu a globálním inovacím největší šanci je v brzké době následovat." 
                },
                { 
                    title: "Historický úspěch českého týmu v belgickém Spa", 
                    source: "Sport.cz", 
                    link: "https://www.sport.cz/clanek/moto-historicky-uspech-ceskeho-tymu-v-belgickem-spa-ovladl-slavny-zavod-5495385", 
                    description: "Tým Mičánek Motorsport zaznamenal na světoznámém okruhu Spa-Francorchamps historický triumf v prestižním závodě. Tento obrovský úspěch ukazuje, že český motorsport dokáže se svou špičkovou technikou i talentovanými jezdci naprosto rovnocenně bojovat s celosvětovou elitou." 
                },
                { 
                    title: "Český startup odkoupí podíly zaměstnanců za 100 milionů", 
                    source: "CzechCrunch", 
                    link: "https://cc.cz/odmena-ze-to-s-nami-tahnete-od-zacatku-cesky-startup-od-sveho-tymu-odkoupi-podily-za-100-milionu/", 
                    description: "Úžasný příklad pozitivní firemní kultury a ocenění vlastních lidí! Český technologický startup Better Stack ukazuje, jak v praxi odměnit zaměstnance za jejich věrnost. Členům svého týmu nabídl výkup jejich zaměstnaneckých akcií v celkové hodnotě neuvěřitelných 100 milionů korun." 
                },
                { 
                    title: "Unikátní objev českých vědců mění pohled na biologii", 
                    source: "Ekolist.cz", 
                    link: "https://ekolist.cz/cz/zpravodajstvi/zpravy/unikatni-objev-ceskych-vedcu-americti-lososi-mohou-prenaset-tasemnice", 
                    description: "Tým expertů z českobudějovického Biologického centra Akademie věd ČR zaznamenal jedinečný přírodovědecký objev u pacifických lososů. Výzkum ukazuje, že čeští experti na přírodní vědy hrají klíčovou roli v celosvětovém chápání a objasňování složitých přírodních ekosystémů po celém světě." 
                },
                { 
                    title: "Nasadit umělou inteligenci je hračka, hlásí český startup", 
                    source: "CzechCrunch", 
                    link: "https://cc.cz/nasadit-ai-je-hracka-ale-uridit-ji-peklo-hlasi-cesky-startup-ktery-na-to-ziskal-desitky-milionu/", 
                    description: "Liberecká technologická firma Pointee úspěšně řeší celosvětový problém s integrací umělé inteligence ve velkých podnicích. Tento nadějný český startup získal investici v řádu desítek milionů korun na vývoj nástrojů, které firmám pomáhají spolehlivě řídit a efektivně organizovat složité systémy AI." 
                },
                { 
                    title: "Český šermíř Alexander Choupenitch vybojoval medaili", 
                    source: "Sport.cz", 
                    link: "https://www.sport.cz/clanek/ostatni-choupenitch-ma-jistou-medaili-z-ms-v-semifinale-porazil-ruskeho-soupere-5507679", 
                    description: "Obrovská radost pro český sport! Alexander Choupenitch znovu dokázal, že patří mezi naprostou světovou špičku. Na mistrovství nevídaným způsobem deklasoval svého soupeře, zajistil si další nádhernou medaili a navázal tak na svůj předchozí historický úspěch z olympiády." 
                },
                { 
                    title: "Český startup jako jeden z prvních na světě prodává AI zákazníkům", 
                    source: "CzechCrunch", 
                    link: "https://cc.cz/k-placeni-nepotrebuji-souhlas-cloveka-cesky-startup-jako-jeden-z-prvnich-prodava-robotickym-zakaznikum/", 
                    description: "Doslova sci-fi technologie, která ožívá u nás! Český startup vstoupil na zcela neprobádaný trh a jako jeden z prvních na světě začal prodávat služby přímo robotickým a AI zákazníkům. Těmto autonomním systémům nyní české řešení umožňuje efektivně nakupovat a platit zcela bez zásahu člověka." 
                },
                { 
                    title: "Plavec Čejka slaví obrovský historický úspěch", 
                    source: "Sport.cz", 
                    link: "https://www.sport.cz/clanek/vodni-sporty-cesky-medaile-neobhajily-cejka-slavi-historicky-uspech-5513190", 
                    description: "Český plavecký sport se dočkal dalšího neuvěřitelného milníku! Talentovaný znakař Jan Čejka předvedl na prestižním šampionátu výkon životní formy a v neskutečné celosvětové konkurenci si doplaval pro historický úspěch. Znovu tak dokázal, že čeští mladí sportovci dokážou přepisovat dějiny." 
                }
            ];

            while (articles.length < 11) {
                articles.push(realFallbackData[articles.length % realFallbackData.length]);
            }

            currentArticles = articles.map(a => ({
                ...a,
                imageUrl: getPerfectImage(a.title)
            }));

            renderArticlesToGrid();
        }

        function renderArticlesToGrid() {
            const grid = document.getElementById('news-grid');
            const loading = document.getElementById('news-loading');
            grid.innerHTML = ''; 

            currentArticles.forEach((article, index) => {
                let colClass = "", flexDir = "", imgWrapperClass = "", textWrapperClass = "", imgHeight = "", titleSize = "";

                if (index < 2) {
                    colClass = "md:col-span-6"; flexDir = "flex flex-col xl:flex-row"; imgWrapperClass = "w-full xl:w-1/2"; imgHeight = "h-64 xl:h-auto xl:min-h-[300px]"; textWrapperClass = "w-full xl:w-1/2 p-8 flex flex-col justify-center"; titleSize = "text-2xl sm:text-3xl";
                } else {
                    colClass = "md:col-span-4"; flexDir = "flex flex-col h-full"; imgWrapperClass = "w-full"; imgHeight = "h-56"; textWrapperClass = "p-6 flex flex-col flex-grow justify-between"; titleSize = "text-xl font-bold";
                }

                grid.innerHTML += `
                    <article class="glass-card ${colClass} ${flexDir}">
                        <div class="img-container ${imgWrapperClass} ${imgHeight}">
                            <img src="${article.imageUrl}" alt="Fotografie" onerror="this.onerror=null; this.src='https://picsum.photos/seed/article${index}/1000/800';">
                        </div>
                        <div class="${textWrapperClass}">
                            <div>
                                <div class="text-green-400 text-xs font-bold uppercase tracking-widest mb-3">📰 ${article.source}</div>
                                <h3 class="${titleSize} font-extrabold text-white mb-6 leading-snug">${article.title}</h3>
                            </div>
                            <div class="${index >= 2 ? 'mt-auto pt-4 border-t border-white/10 text-center' : 'mt-4'} xl:text-left">
                                <button onclick="openArticleDetail(${index})" class="btn-read-more w-full sm:w-auto">Číst více</button>
                            </div>
                        </div>
                    </article>
                `;
            });
            
            loading.classList.add('hidden');
            grid.classList.remove('hidden');
        }

        // ČTECÍ MÓD S AKTIVNÍM ODKAZEM
        function generateArticleText(article) {
            let contentHtml = "";

            if (article.description) {
                contentHtml = `<p class="mb-8 text-slate-300 leading-relaxed">${article.description}</p>`;
            } else {
                contentHtml = `<p class="mb-8 text-slate-300 leading-relaxed text-xl">Připravujeme pro vás podrobnosti k této události s názvem „${article.title}“.</p>`;
            }

            return `
                ${contentHtml}
                <!-- TLAČÍTKO VEDOUCÍ NA REÁLNÝ WEB -->
                <div class="mt-10 pt-8 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <span class="text-slate-400 text-sm font-medium">Zajímá vás celý příběh a všechny detaily?</span>
                    <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-green-400 hover:text-green-300 font-bold transition-colors text-base sm:text-lg group bg-green-500/10 hover:bg-green-500/20 px-6 py-3 rounded-xl">
                        Otevřít původní článek
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 group-hover:translate-x-1 transition-transform">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                        </svg>
                    </a>
                </div>
            `;
        }

        function openArticleDetail(index) {
            const article = currentArticles[index];
            document.getElementById('detail-title').innerText = article.title;
            
            const detailImg = document.getElementById('detail-img');
            detailImg.src = article.imageUrl;
            detailImg.onerror = function() { 
                this.onerror = null; 
                this.src = `https://picsum.photos/seed/article${index}/1920/1080`; 
            };
            
            document.getElementById('detail-content').innerHTML = generateArticleText(article);
            
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('article-view').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function closeArticleDetail() {
            document.getElementById('article-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function createFloatingPlus() {
            const bg = document.getElementById('dynamic-bg');
            if (!bg) return;
            const plus = document.createElement('div');
            plus.className = 'floating-plus';
            plus.innerText = '+';
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = Math.random() * 3.5 + 1.5;
            const duration = Math.random() * 4 + 4; 
            plus.style.left = `${x}vw`;
            plus.style.top = `${y}vh`;
            plus.style.fontSize = `${size}rem`;
            plus.style.animationDuration = `${duration}s`;
            bg.appendChild(plus);
            setTimeout(() => { plus.remove(); }, duration * 1000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchAndRenderNews();
            setInterval(createFloatingPlus, 250);
        });
    </script>
</body>
</html>
